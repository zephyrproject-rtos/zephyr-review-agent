name: "Zephyr AI Review"
description: >-
  Reviews a Zephyr pull request with a tool-using model: a source-intelligence MCP server is
  started on the runner, the model investigates the tree through it via OpenRouter, and the
  findings are posted back to the pull request.
author: "Anas Nashif"

branding:
  icon: "search"
  color: "blue"

inputs:
  openrouter_api_key:
    description: "OpenRouter API key. Store it as a repository secret."
    required: true
  github_token:
    description: "Token used to read the pull request and post comments."
    required: false
    default: ${{ github.token }}
  pr_number:
    description: "Pull request number. Defaults to the number in the triggering event."
    required: false
    default: ""
  repo_root:
    description: "Path to the Zephyr checkout on the runner."
    required: false
    default: ${{ github.workspace }}

  model:
    description: "Primary OpenRouter model slug."
    required: false
    default: "deepseek/deepseek-v4.1-flash"
  fallback_models:
    description: "Comma-separated OpenRouter slugs tried in order if the primary is unavailable."
    required: false
    default: ""
  provider:
    description: "OpenRouter provider routing preferences as JSON, e.g. {\"data_collection\":\"deny\"}."
    required: false
    default: ""
  pipeline:
    description: >-
      `single` (one agent), `two-stage` (a draft model investigates, `model` verifies), or
      `multi-stage` (parallel specialist passes chosen from the change, a verification stage that
      must account for every candidate, and per-finding re-verification of contested cases). `auto`
      picks two-stage when `draft_model` is set, else single.
    required: false
    default: "auto"
  draft_model:
    description: >-
      Low-cost model. In two-stage it investigates and drafts; in multi-stage it runs the
      specialist passes. `model` always verifies and finalizes. Empty: `model` does everything.
    required: false
    default: ""
  specialists:
    description: >-
      multi-stage: comma-separated passes (intent, logic, concurrency, resources, hardware,
      build_config, security) instead of planning them from the change.
    required: false
    default: ""
  specialist_max_steps:
    required: false
    default: "15"
  hard_case_max_steps:
    required: false
    default: "12"
  max_hard_cases:
    description: "multi-stage: hard cases verified individually; the rest are batched into one stage."
    required: false
    default: "8"
  draft_fallback_models:
    description: "Comma-separated fallbacks for the draft model."
    required: false
    default: ""
  verify_max_steps:
    description: "Step budget of the verifying model in two-stage mode."
    required: false
    default: "15"
  dossier_chars:
    description: "Size of the stage-1 evidence handed to the verifying model."
    required: false
    default: "40000"
  temperature:
    required: false
    default: "0.1"
  max_tokens:
    description: "Maximum tokens per model response."
    required: false
    default: "8000"
  max_steps:
    description: "Maximum model turns (each turn may issue several tool calls) before the review is forced."
    required: false
    default: "40"
  max_context_tokens:
    description: "Prompt size at which the review is forced to conclude."
    required: false
    default: "160000"
  model_timeout_seconds:
    description: "Seconds to wait for one model response before retrying."
    required: false
    default: "300"
  tool_timeout_seconds:
    description: "Seconds to wait for one source-intelligence tool call before reporting it as failed."
    required: false
    default: "120"
  max_stage_seconds:
    description: >-
      Wall-clock budget for each agent run (the review, or each stage of a staged pipeline). When
      exceeded the model is forced to submit what it has. 0 disables.
    required: false
    default: "0"
  max_tool_result_chars:
    description: "Size cap on each tool result handed to the model."
    required: false
    default: "24000"
  prefetch_chars:
    description: >-
      Budget for prefetched context in the opening message: the functions each hunk lands in and
      their callers, read at the head commit. Saves the model the round trips of fetching them. 0
      disables.
    required: false
    default: "24000"
  inline_diff_chars:
    description: "Diffs up to this size are included in the opening message; larger ones are fetched per file."
    required: false
    default: "60000"

  generate_test_plan:
    description: >-
      Also produce a test plan: the twister suites and scenarios that exercise the change, with
      platform coverage derived from changed boards, SoCs, architectures and driver bindings.
      Rendered in the comment and written to <output_dir>/test_plan.yaml.
    required: false
    default: "false"
  include_ci:
    description: "Give the model the head commit's check runs and a tool to read failed job logs (needs actions: read)."
    required: false
    default: "true"
  lockdown:
    description: >-
      How pull request text from people without push access is handled. `label` (default) tags every
      author as maintainer, collaborator, bot or external and frames all PR text as data; `strict`
      additionally withholds comments from external users other than the PR author; `off` disables
      tagging. CLI flags can tighten this but never relax it.
    required: false
    default: "label"
  include_linked_issues:
    description: >-
      Fetch the issues and pull requests the change refers to (title, body, commits, discussion) and
      give the model their symptom and status, plus a linked_issue tool for the full text.
    required: false
    default: "true"
  max_linked_issues:
    required: false
    default: "8"
  include_discussion:
    description: >-
      Give the model the existing conversation, inline review threads and review states. Set to
      false to review the change on its own merits, unaffected by what was already said (useful
      when testing).
    required: false
    default: "true"
  max_discussion_chars:
    description: "Size of the discussion digest in the opening message; the full text stays available as a tool."
    required: false
    default: "12000"

  review_profile:
    description: "Built-in profile name (zephyr) or path to a Markdown file with your own."
    required: false
    default: "zephyr"
  project_context:
    description: "Extra maintainer guidance handed to the model."
    required: false
    default: ""
  language:
    required: false
    default: "English"

  skip_labels:
    description: "Comma-separated labels that suppress the review."
    required: false
    default: "no-ai-review,skip-review"
  required_labels:
    description: "If set, the review only runs when the PR carries one of these labels."
    required: false
    default: ""
  skip_draft:
    required: false
    default: "true"

  post_comment:
    description: "Post (and update in place) the summary comment."
    required: false
    default: "true"
  post_inline_comments:
    description: >-
      Post each finding anchored to a changed line as an inline review comment at that line, keeping
      the top-level comment for the overall assessment and unanchored findings. `false` puts every
      finding in the top-level comment.
    required: false
    default: "true"
  show_run_details:
    description: >-
      Append the run details (models, steps, tool calls, tokens, cost, time) to the posted comment,
      the job summary and the log. Off by default: then they appear only in review.json.
    required: false
    default: "false"
  comment_tag:
    description: "Hidden marker used to find and update the previous comment."
    required: false
    default: "zephyr-reviewer"
  fail_on_severity:
    description: "Fail the step when a finding at or above this severity stands: none, suggestion, low, medium, high, critical."
    required: false
    default: "none"
  publish:
    description: >-
      `post` publishes the review to the pull request. `ask` saves it (comment.md, review.json) for a
      person to read and publish later with `zephyr-reviewer post`; nothing reaches the PR from the
      job. `never` is a dry run. Can only be tightened by CLI flags, never relaxed.
    required: false
    default: "post"
  dry_run:
    description: "Alias for publish: never."
    required: false
    default: "false"
  output_dir:
    description: "Where comment.md, review.json and transcript.jsonl are written."
    required: false
    default: "review-output"

outputs:
  verdict:
    description: "approve, comment, request_changes, skipped or error."
    value: ${{ steps.review.outputs.verdict }}
  findings_count:
    value: ${{ steps.review.outputs.findings_count }}
  highest_severity:
    value: ${{ steps.review.outputs.highest_severity }}
  test_plan_count:
    description: "Number of test plan entries, when a test plan was requested."
    value: ${{ steps.review.outputs.test_plan_count }}
  comment_url:
    value: ${{ steps.review.outputs.comment_url }}
  review_url:
    value: ${{ steps.review.outputs.review_url }}
  inline_count:
    description: "Number of inline review comments posted."
    value: ${{ steps.review.outputs.inline_count }}
  posted:
    description: "true when something was posted to the pull request."
    value: ${{ steps.review.outputs.posted }}
  skipped:
    value: ${{ steps.review.outputs.skipped }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.12"

    - name: Install zephyr-reviewer
      shell: bash
      run: python -m pip install --quiet "${GITHUB_ACTION_PATH}"

    - name: Review
      id: review
      shell: bash
      run: zephyr-reviewer review
      env:
        INPUT_OPENROUTER_API_KEY: ${{ inputs.openrouter_api_key }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        INPUT_REPO_ROOT: ${{ inputs.repo_root }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_FALLBACK_MODELS: ${{ inputs.fallback_models }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_PIPELINE: ${{ inputs.pipeline }}
        INPUT_DRAFT_MODEL: ${{ inputs.draft_model }}
        INPUT_SPECIALISTS: ${{ inputs.specialists }}
        INPUT_SPECIALIST_MAX_STEPS: ${{ inputs.specialist_max_steps }}
        INPUT_HARD_CASE_MAX_STEPS: ${{ inputs.hard_case_max_steps }}
        INPUT_MAX_HARD_CASES: ${{ inputs.max_hard_cases }}
        INPUT_DRAFT_FALLBACK_MODELS: ${{ inputs.draft_fallback_models }}
        INPUT_VERIFY_MAX_STEPS: ${{ inputs.verify_max_steps }}
        INPUT_DOSSIER_CHARS: ${{ inputs.dossier_chars }}
        INPUT_TEMPERATURE: ${{ inputs.temperature }}
        INPUT_MAX_TOKENS: ${{ inputs.max_tokens }}
        INPUT_MAX_STEPS: ${{ inputs.max_steps }}
        INPUT_MAX_CONTEXT_TOKENS: ${{ inputs.max_context_tokens }}
        INPUT_MODEL_TIMEOUT_SECONDS: ${{ inputs.model_timeout_seconds }}
        INPUT_TOOL_TIMEOUT_SECONDS: ${{ inputs.tool_timeout_seconds }}
        INPUT_MAX_STAGE_SECONDS: ${{ inputs.max_stage_seconds }}
        INPUT_MAX_TOOL_RESULT_CHARS: ${{ inputs.max_tool_result_chars }}
        INPUT_PREFETCH_CHARS: ${{ inputs.prefetch_chars }}
        INPUT_INLINE_DIFF_CHARS: ${{ inputs.inline_diff_chars }}
        INPUT_GENERATE_TEST_PLAN: ${{ inputs.generate_test_plan }}
        INPUT_INCLUDE_CI: ${{ inputs.include_ci }}
        INPUT_LOCKDOWN: ${{ inputs.lockdown }}
        INPUT_INCLUDE_LINKED_ISSUES: ${{ inputs.include_linked_issues }}
        INPUT_MAX_LINKED_ISSUES: ${{ inputs.max_linked_issues }}
        INPUT_INCLUDE_DISCUSSION: ${{ inputs.include_discussion }}
        INPUT_MAX_DISCUSSION_CHARS: ${{ inputs.max_discussion_chars }}
        INPUT_REVIEW_PROFILE: ${{ inputs.review_profile }}
        INPUT_PROJECT_CONTEXT: ${{ inputs.project_context }}
        INPUT_LANGUAGE: ${{ inputs.language }}
        INPUT_SKIP_LABELS: ${{ inputs.skip_labels }}
        INPUT_REQUIRED_LABELS: ${{ inputs.required_labels }}
        INPUT_SKIP_DRAFT: ${{ inputs.skip_draft }}
        INPUT_POST_COMMENT: ${{ inputs.post_comment }}
        INPUT_POST_INLINE_COMMENTS: ${{ inputs.post_inline_comments }}
        INPUT_SHOW_RUN_DETAILS: ${{ inputs.show_run_details }}
        INPUT_COMMENT_TAG: ${{ inputs.comment_tag }}
        INPUT_FAIL_ON_SEVERITY: ${{ inputs.fail_on_severity }}
        INPUT_PUBLISH: ${{ inputs.publish }}
        INPUT_DRY_RUN: ${{ inputs.dry_run }}
        INPUT_OUTPUT_DIR: ${{ inputs.output_dir }}
